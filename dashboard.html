    <div class="main-content-right">

        <div class="header">
            <div class="one">
                <img height="80px"
                    src="../New folder/pngtree-blue-clipboard-with-checked-items-icon-representing-task-completion-and-organization-png-image_19533774.webp"
                    alt="">
                <div class="title-text">
                    <h1>Task Management</h1>
                    <p>Organize your task and get things done</p>
                </div>
            </div>

            <div class="two">
                <img height="40px"
                    src="https://www.shutterstock.com/image-vector/brightness-icon-intensity-setting-vector-260nw-1192307527.jpg"
                    alt="">
                <h1 id="display-name">hello ! </h1>
                <button id="name-avatar" type="button" class="name-badge">name</button>
            </div>
        </div>
      


<div class="task">
    <h2 id="text"> Add New Task</h2>
    <div class="second">
        <!-- IDs confirm kar lein -->
        <input type="text" placeholder="what do you need to do ?" id="add-task"><br>
        <select name="" id="select-priority">
            <option>priority: Medium</option>
            <option> High</option>
            <option> Medium</option>
            <option>low</option>
        </select><br>
        <input type="date" id="task-date" class="task-date"> <!-- ID add ki -->
        <button class="task-btn" onclick="addTask()">+ Add Task</button> <!-- onclick function add kiya -->
    </div>
</div>

<div class="boxes">
    <div class="total-task">
        <img height="50px" src="https://thumbs.dreamstime.com/b/checklist-complete-task-icon-blue-color-checklist-complete-task-icon-beautiful-meticulously-designed-icon-well-organized-190950950.jpg" alt="">
        <!-- Number par ID laga di -->
        <h1 id="total-counter">0</h1>
    </div>
    <div class="completed">
        <img height="50px" src="https://img.magnific.com/free-vector/verified-ribbon-check-mark-green_78370-6057.jpg?semt=ais_test_b&w=740&q=80" alt="">
        <h1 id="completed-counter">0</h1>
    </div>
    <div class="pending">
        <img height="50px" src="https://planetsignshop.com/cdn/shop/products/PENDING-10IN-ROUND-RIDER-BLACK-YELLOW.gif?v=1656448973" alt="">
        <h1 id="pending-counter">0</h1>
    </div>
    <div class="important">
        <img height="50px" src="https://www.shutterstock.com/shutterstock/photos/1731547549/display_1500/stock-vector-afghan-air-force-roundel-military-symbol-vector-illustration-1731547549.jpg" alt="">
        <h1 id="important-counter">0</h1>
    </div>
</div>
