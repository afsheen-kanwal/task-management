<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Manager - Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>

<div class="app">

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg>
      </span>
      <strong>Task Manager</strong>
    </div>

    <nav class="nav" aria-label="Task filters">
      <button class="nav-item active" data-filter="all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        All Tasks
      </button>
      <button class="nav-item" data-filter="completed">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1f9d6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
        Completed
      </button>
      <button class="nav-item" data-filter="pending">
        <svg viewBox="0 0 24 24" fill="none" stroke="#d99a00" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
        Pending
      </button>
      <button class="nav-item" data-filter="important">
        <svg viewBox="0 0 24 24" fill="none" stroke="#d6336c" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>
        Important
      </button>
    </nav>

    <div class="side-bottom">
      <div class="nav-static">Settings</div>
      <div class="nav-static">About</div>
      <p class="quote">Small steps every day lead to big results.</p>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <main class="content">

    <header class="topbar">
      <div>
        <h1>Task Management</h1>
        <p>Organize your tasks and get things done</p>
      </div>
      <div class="user">
        <div class="theme-switch" role="group" aria-label="Choose theme">
          <button type="button" data-theme-btn="default" title="Default (purple)" aria-label="Default purple theme" style="--sw: linear-gradient(135deg,#5b3fd9,#c28aea)"></button>
          <button type="button" data-theme-btn="light" title="Light (sky blue)" aria-label="Light theme" style="--sw: linear-gradient(135deg,#1b7fd1,#bfe0ff)"></button>
          <button type="button" data-theme-btn="dark" title="Dark" aria-label="Dark theme" style="--sw: linear-gradient(135deg,#0f0d1c,#7a58f0)"></button>
        </div>
        <span id="display-name">Hello!</span>
        <button id="name-avatar" type="button" class="name-badge" aria-label="Your profile">U</button>
      </div>
    </header>

    <!-- Add task -->
    <section class="task" aria-label="Add a new task">
      <h2 id="text">Add New Task</h2>
      <div class="second">
        <input type="text" placeholder="What do you need to do?" id="add-task" aria-label="Task description">
        <select id="select-priority" aria-label="Priority">
          <option value="High">High priority</option>
          <option value="Medium" selected>Medium priority</option>
          <option value="Low">Low priority</option>
        </select>
        <input type="date" id="task-date" class="task-date" aria-label="Due date">
        <button class="task-btn" onclick="addTask()">+ Add Task</button>
      </div>
    </section>

    <!-- Counters -->
    <section class="boxes" aria-label="Task summary">
      <div class="stat total-task">
        <span class="stat-icon" style="--c:#5b3fd9"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg></span>
        <div><h1 id="total-counter">0</h1><span>Total</span></div>
      </div>
      <div class="stat completed">
        <span class="stat-icon" style="--c:#1f9d6b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg></span>
        <div><h1 id="completed-counter">0</h1><span>Completed</span></div>
      </div>
      <div class="stat pending">
        <span class="stat-icon" style="--c:#d99a00"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg></span>
        <div><h1 id="pending-counter">0</h1><span>Pending</span></div>
      </div>
      <div class="stat important">
        <span class="stat-icon" style="--c:#d6336c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg></span>
        <div><h1 id="important-counter">0</h1><span>Important</span></div>
      </div>
    </section>

    <!-- Task list -->
    <h2 class="list-title" id="list-title">All Tasks</h2>
    <div id="task-list-container"></div>

  </main>
</div>

<div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
